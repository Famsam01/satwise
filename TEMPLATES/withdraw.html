<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Nexvest | Withdraw</title>
    <link rel="stylesheet" href="/static/style/withdraw.css" />
  </head>
  <body>
    <main class="wd-page">
      <div class="wd-wrap">
        <header class="wd-top">
          <button class="wd-back" id="wdBack" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          </button>
          <h1>Withdraw</h1>
          <span class="wd-spacer"></span>
        </header>

        <!-- FORM -->
        <section id="wdForm">
          <div class="wd-balance">
            <span class="wd-sub">Available balance</span>
            <strong id="wdSats">0 sats</strong>
            <div class="wd-balance-row">
              <span id="wdBtc">₿ 0.00000000</span
              ><span id="wdUsd">≈ $0.00</span>
            </div>
          </div>

          <label class="wd-label" for="wdCoin">Withdraw as</label>
          <select
            class="wd-input"
            id="wdCoin"
            aria-label="Currency and network"
          ></select>

          <div id="wdDest"></div>

          <label class="wd-label" for="wdAmount">Amount</label>
          <div class="wd-amount">
            <input
              id="wdAmount"
              type="text"
              inputmode="numeric"
              placeholder="0"
              autocomplete="off"
            />
            <span>sats</span>
          </div>
          <div class="wd-quick" id="wdQuick">
            <button type="button" data-p="25">25%</button>
            <button type="button" data-p="50">50%</button>
            <button type="button" data-p="75">75%</button>
            <button type="button" data-p="100">Max</button>
          </div>
          <small class="wd-err" id="wdErr"></small>

          <div class="wd-summary" id="wdSummary"></div>

          <button class="wd-cta" id="wdContinue" type="button" disabled>
            Continue
          </button>

          <h2 class="wd-h2">Recent withdrawals</h2>
          <ul class="wd-history" id="wdHistory"></ul>
        </section>

        <!-- SUCCESS -->
        <section id="wdSuccess" class="wd-success" hidden>
          <div class="wd-check">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
          </div>
          <h2>Withdrawal requested</h2>
          <p id="wdSuccessText"></p>
          <div class="wd-summary" id="wdSuccessSummary"></div>
          <button class="wd-cta" id="wdHome" type="button">Back to home</button>
          <button class="wd-ghost" id="wdAgain" type="button">
            Make another withdrawal
          </button>
        </section>
      </div>
    </main>

    <!-- CONFIRM SHEET -->
    <div class="wd-overlay" id="wdSheet" hidden>
      <div
        class="wd-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="wdSheetTitle"
      >
        <h2 id="wdSheetTitle">Confirm withdrawal</h2>
        <div class="wd-summary" id="wdSheetSummary"></div>
        <p class="wd-warn" id="wdSheetWarn"></p>
        <div class="wd-actions">
          <button class="wd-ghost" id="wdCancel" type="button">Cancel</button>
          <button class="wd-cta" id="wdConfirm" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <div class="wd-toast" id="wdToast" role="status"></div>

    <script src="/static/JS/user.js"></script>
    <script src="/static/JS/nx_api.js"></script>
    <script src="/static/JS/withdraw.js"></script>
  </body>
</html>
